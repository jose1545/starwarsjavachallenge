spring.application.name=starwarschallenge
swapi.base-url=${SWAPI_URL:https://www.swapi.tech/api}
swapi.connection-timeout=2s
swapi.read-timeout=5s
spring.datasource.url=jdbc:h2:mem:starwars;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
auth.seed.username=${AUTH_SEED_USERNAME:}
auth.seed.password=${AUTH_SEED_PASSWORD:}
jwt.secret=${JWT_SECRET:}
jwt.issuer=starwarschallenge
jwt.ttl-seconds=1800
